name: Package compression validation
on:
  push:
    branches: [maintenance/release-package-optimization]
  pull_request:
    paths:
      - 'tools/experience/optimize_package.py'
      - 'tools/experience/test_package_compression.py'
      - 'tools/experience/package_normal.py'
      - '.github/workflows/package-optimization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Download the immutable benchmark package
        shell: python
        run: |
          import hashlib, pathlib, urllib.request, zipfile
          path = pathlib.Path('original.zip')
          urllib.request.urlretrieve('https://github.com/hyp36rmax/VO_PATCH_EX/releases/download/v0.18.0-experience.1/VO-PATCH-EX-Experience.zip', path)
          assert hashlib.sha256(path.read_bytes()).hexdigest() == 'd9afa87394bc3b69e596c942064dd2be6b489d67f3cfdc61e265600d6c05f4d7'
          with zipfile.ZipFile(path) as archive:
              archive.extractall('original')
      - name: Assemble and check the candidate
        shell: bash
        run: |
          python tools/experience/test_package_compression.py
          python tools/experience/optimize_package.py original candidate
          python tools/experience/test_normal_package.py candidate
      - name: Exercise the shipped interpreter and launcher
        shell: python
        run: |
          import hashlib, json, pathlib, shutil, subprocess, zipfile
          root = pathlib.Path('candidate').resolve()
          original = pathlib.Path('original').resolve()
          changed = [p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file() and p.read_bytes() != (original / p.relative_to(root)).read_bytes()]
          assert set(changed) == {'PACKAGE-SHA256.json', '_internal/experience/catalog/recipes.zip'}, changed
          shutil.copytree(root, 'smoke')
          smoke = pathlib.Path('smoke').resolve()
          script = "import hashlib,json,pathlib,zipfile; p=pathlib.Path(__import__('sys').argv[1]); index=json.loads((p/'catalog.json').read_text())['entries']; z=zipfile.ZipFile(p/'recipes.zip'); assert len(index)==512; assert all(hashlib.sha256(z.read(n)).hexdigest()==e['sha256'] for n,e in index.items()); print('PASS shipped Windows Python reads all 512 LZMA recipes')"
          subprocess.run([str(smoke/'_internal/python.exe'), '-c', script, str(smoke/'_internal/experience/catalog')], check=True, timeout=120)
          subprocess.run([str(smoke/'v-on-patcher.exe'), '--selfcheck'], check=True, timeout=60)
          subprocess.run(['python', 'tools/experience/test_normal_package.py', str(root)], check=True)
          shutil.make_archive('VO-PATCH-EX-Optimized-Candidate', 'zip', root)
      - uses: actions/upload-artifact@v4
        with:
          name: optimized-package-candidate
          path: VO-PATCH-EX-Optimized-Candidate.zip
          retention-days: 7
