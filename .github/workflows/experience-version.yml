name: Experience version validation
on:
  push:
    branches: [fix/experience-prerelease-version]
  pull_request:
    paths:
      - 'tools/experience/release_version.py'
      - 'tools/experience/test_release_version.py'
      - 'tools/experience/package_normal.py'
      - '.github/workflows/experience-version.yml'
permissions:
  contents: read
jobs:
  windows-version:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Prepare published native build inputs
        shell: python
        run: |
          import hashlib, pathlib, shutil, urllib.request, zipfile
          path = pathlib.Path('original.zip')
          urllib.request.urlretrieve('https://github.com/hyp36rmax/VO_PATCH_EX/releases/download/v0.18.0-experience.1/VO-PATCH-EX-Experience.zip', path)
          assert hashlib.sha256(path.read_bytes()).hexdigest() == 'd9afa87394bc3b69e596c942064dd2be6b489d67f3cfdc61e265600d6c05f4d7'
          with zipfile.ZipFile(path) as z: z.extractall('baseline')
          shutil.move('baseline/_internal/experience', 'inputs')
          pathlib.Path('wrapper').mkdir()
          shutil.copy2('inputs/payload/ddraw.dll', 'wrapper/ddraw.dll')
          shutil.copy2('baseline/Licenses/cnc-ddraw-MIT.txt', 'wrapper/LICENSE')
          shutil.copy2('baseline/Licenses/MinGW-runtime.txt', 'wrapper/MinGW-runtime.txt')
      - name: Assemble and verify versioned package
        shell: bash
        run: |
          python tools/experience/package_normal.py candidate baseline inputs/catalog wrapper inputs/payload/vodisplay.dll
          python tools/experience/test_normal_package.py candidate
          python tools/experience/test_release_version.py candidate
      - name: Verify shipped interpreter and launcher
        shell: python
        run: |
          import pathlib, shutil, subprocess, sys
          sys.path.insert(0, 'tools/experience')
          from release_version import VERSION
          shutil.copytree('candidate', 'smoke')
          root = pathlib.Path('smoke').resolve()
          result = subprocess.check_output([str(root/'_internal/python.exe'), '-B', str(root/'_internal/v-on-patcher.py'), '--version'], text=True, timeout=60)
          assert result.strip() == VERSION, result
          subprocess.run([str(root/'v-on-patcher.exe'), '--selfcheck'], check=True, timeout=60)
